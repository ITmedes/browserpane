[package]
name = "bpane-runtime-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Policy-validating runtime operation broker for BrowserPane"
repository = "https://github.com/ITmedes/browserpane"
readme = "../../../README.md"
keywords = ["browserpane", "runtime", "broker", "security"]
categories = ["web-programming::http-server", "virtualization"]

[[bin]]
name = "bpane-runtime-broker"
path = "src/main.rs"

[dependencies]
bpane-runtime-contract.workspace = true
bpane-telemetry.workspace = true
anyhow.workspace = true
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
bollard.workspace = true
bytes = "1"
flate2 = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = { version = "9", features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tar = "0.4"
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
