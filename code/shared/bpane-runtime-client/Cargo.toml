[package]
name = "bpane-runtime-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded OAuth2 client for the BrowserPane runtime broker"
repository = "https://github.com/ITmedes/browserpane"
readme = "../../../README.md"
keywords = ["browserpane", "runtime", "oauth2", "client"]
categories = ["web-programming::http-client", "authentication"]

[dependencies]
bpane-runtime-contract.workspace = true
bpane-telemetry.workspace = true
async-trait = "0.1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
hex = "0.4"
sha2 = "0.10"
serde_json = "1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
axum = "0.8"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
serde = { version = "1", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
