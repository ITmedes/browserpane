map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=5s;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }

    location = /auth-config.json {
        alias /run/browserpane/auth-config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/ {
        set $gateway_api http://gateway:8932;
        proxy_pass $gateway_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        include /etc/nginx/snippets/admin-security-headers.conf;
        return 302 /admin/;
    }

    location ^~ /admin/ {
        include /etc/nginx/snippets/admin-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin-new {
        include /etc/nginx/snippets/admin-security-headers.conf;
        return 302 /admin-new/;
    }

    location ^~ /admin-new/ {
        include /etc/nginx/snippets/admin-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /admin-new/index.html;
    }

    location = /recording-worker.html {
        include /etc/nginx/snippets/admin-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/admin-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 302 /admin-new/;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
