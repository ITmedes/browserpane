# Local-only dependencies and login metadata for qualifying the production profile.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:e0f565815b2b8e78eb9fdbb80f6190c921ab323aaa8ccceab3255c6d4225f4af
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./fixture/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./generated/telemetry:/var/lib/otel
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - broker-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: browserpane
      POSTGRES_USER: browserpane
      POSTGRES_PASSWORD: single-node-fixture
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browserpane -d browserpane"]
      interval: 5s
      timeout: 5s
      retries: 18
    volumes:
      - fixture-postgres:/var/lib/postgresql/data
    networks:
      - runtime

  vault:
    image: hashicorp/vault:1.19
    command:
      - server
      - -dev
      - -dev-root-token-id=single-node-fixture-vault-token
      - -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - runtime

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: fixture-admin
      KC_HOSTNAME: http://localhost:18091
    ports:
      - "127.0.0.1:18091:8080/tcp"
    volumes:
      - ./generated/keycloak-realm.json:/opt/keycloak/data/import/browserpane-dev-realm.json:ro
    networks:
      - runtime
      - broker-auth

  web:
    ports: !override
      - "127.0.0.1:18080:8080/tcp"
    volumes:
      - ./fixture/auth-config.template.json:/usr/share/nginx/html/auth-config.template.json:ro
    depends_on:
      keycloak:
        condition: service_started

  gateway:
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: always_on
      OTEL_BSP_MAX_QUEUE_SIZE: "2048"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "256"
      OTEL_BSP_SCHEDULE_DELAY: "200"
      OTEL_BSP_EXPORT_TIMEOUT: "2000"
    ports: !override
      - "14433:4433/tcp"
      - "14433:4433/udp"
    depends_on:
      otel-collector:
        condition: service_started
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      runtime-broker:
        condition: service_healthy
      vault:
        condition: service_started

  runtime-broker:
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: always_on
      OTEL_BSP_MAX_QUEUE_SIZE: "2048"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "256"
      OTEL_BSP_SCHEDULE_DELAY: "200"
      OTEL_BSP_EXPORT_TIMEOUT: "2000"
    depends_on:
      otel-collector:
        condition: service_started
      docker-proxy:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  fixture-postgres:
    name: bpane-single-node-fixture-postgres
