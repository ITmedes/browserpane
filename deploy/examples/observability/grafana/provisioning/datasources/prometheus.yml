apiVersion: 1

prune: true

datasources:
  - name: BrowserPane Prometheus
    uid: browserpane-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 3.12.0
      timeInterval: 30s
