[workspace]
resolver = "2"
members = [
    "code/shared/bpane-protocol",
    "code/shared/bpane-runtime-contract",
    "code/shared/bpane-runtime-client",
    "code/apps/bpane-host",
    "code/apps/bpane-gateway",
    "code/apps/bpane-runtime-broker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
bpane-protocol = { path = "code/shared/bpane-protocol" }
bpane-runtime-contract = { path = "code/shared/bpane-runtime-contract" }
bpane-runtime-client = { path = "code/shared/bpane-runtime-client" }
bollard = { version = "0.21", default-features = false, features = ["http"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
